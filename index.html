document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

v style=\"font-family:Sora,sans-serif;font-weight:700;font-size:15px\">People with access<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:700;color:var(--mu)\">{{ accessMeta }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ noAccess }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:26px 20px;border-radius:20px;background:var(--s1);border:1px dashed var(--line);text-align:center;font-size:12px;font-weight:600;color:var(--mu);line-height:1.6\">No one invited yet.<br>Add a name and email to create the first access link.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-for list=\"{{ granted }}\" as=\"a\" hint-placeholder-count=\"2\">\n            <div style=\"padding:15px 16px;border-radius:18px;background:var(--s1);border:1px solid var(--line);margin-bottom:10px;animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both\">\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <div style=\"{{ a.avStyle }}\">{{ a.ini }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-family:Sora,sans-serif;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ a.name }}<\u002Fdiv>\n                  <div style=\"font-size:11px;font-weight:600;color:var(--mu);margin-top:2.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ a.desig }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ a.revoke }}\" style=\"flex:none;padding:8px 12px;border-radius:999px;background:transparent;border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--mu);cursor:pointer;transition:all .18s\" style-hover=\"color:#E2607A;border-color:rgba(226,96,122,.5)\">Revoke<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:13px\">\n                <div style=\"padding:10px 1 inter;transition:background .18s\" style-hover=\"background:rgba(245,146,30,.22)\">Email invite<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"{{ tabBarStyle }}\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n      <div sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">\n        <div style=\"{{ t.dotStyle }}\"><\u002Fdiv>\n        <span>{{ t.label }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;transform:translateX(-50%);bottom:106px;z-index:95;padding:13px 20px;border-radius:14px;background:var(--s2);border:1px solid var(--line);color:var(--tx);font-size:12px;font-weight:700;text-align:center;animation:toastIn .26s both;box-shadow:0 14px 40px rgba(0,0,0,.45)\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ sheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ sheetWrapStyle }}\">\n    <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:absolute;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(3px);animation:dimIn .22s both\"><\u002Fdiv>\n    <div style=\"{{ sheetStyle }}\">\n      <div style=\"{{ sheetGrabStyle }}\"><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:center\">\n        <div style=\"{{ sheet.avStyleLg }}\">{{ sheet.ini }}<\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-family:Sora,sans-serif;font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.3px;text-wrap:pretty\">{{ sheet.name }}<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;color:var(--acc);margin-top:4px;line-height:1.3\">{{ sheet.title }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ share }}\" style=\"flex:none;padding:9px 13px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:11px;font-weight:700;cursor:pointer\">Share<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:18px\">\n        <sc-for list=\"{{ sheet.facts }}\" as=\"f\" hint-placeholder-count=\"6\">\n          <div style=\"padding:11px 12px;border-radius:14px;background:var(--soft);border:1px solid var(--line)\">\n            <div style=\"font-size:9.5px;font-weight:700;color:var(--mu);letter-spacing:.7px;text-transform:uppercase\">{{ f.k }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:700;margin-top:4px;word-break:break-word;line-height:1.3\">{{ f.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;margin-top:16px;flex-wrap:wrap\">\n        <sc-if value=\"{{ sheet.hasMgr }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ sheet.goMgr }}\" style=\"flex:1;min-width:150px;padding:14px;border-radius:15px;background:var(--soft);border:1px solid var(--line);text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .18s\" style-hover=\"background:var(--s2)\">Manager's team<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sheet.hasTeam }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ sheet.goTeam }}\" style=\"flex:1;min-width:150px;padding:14px;border-radius:15px;background:linear-gradient(135deg,var(--acc),#E0701A);text-align:center;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 10px 26px rgba(245,146,30,.32);transition:transform .18s\" style-hover=\"transform:translateY(-2px)\">{{ sheet.teamLabel }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C9A227&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#F5921E&quot;,&quot;#E0701A&quot;,&quot;#C9A227&quot;,&quot;#4C9BE0&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dark&quot;,&quot;Light&quot;],&quot;default&quot;:&quot;Dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showTotals&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nconst PAL = ['#F5921E','#E0701A','#C9A227','#7FB3B5','#A77BCA','#5AD07A','#4C9BE0','#E2607A'];\nconst FIX = { 'Pushpendra Sahota':'Pushpender Sahota' };\nconst CEO = 'Divyakant Gupta';\nconst COFOUNDER = 'Rishi Chahal';\nconst ROOTS = [CEO, COFOUNDER];\nconst MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst DARK = { '--page':'#070B14','--bg':'#070B14','--s1':'#0F1522','--s2':'#192234','--line':'rgba(255,255,255,.09)','--tx':'#F2F5FA','--mu':'#8E99AE','--soft':'rgba(255,255,255,.06)','--h1':'linear-gradient(120deg,#fff 20%,#FFC170 80%)','--fade':'rgba(7,11,20,.98)' };\nconst LIGHT = { '--page':'#EEF1F6','--bg':'#F6F8FC','--s1':'#FFFFFF','--s2':'#F0F3F9','--line':'rgba(16,24,40,.11)','--tx':'#161B26','--mu':'#69738A','--soft':'rgba(16,24,40,.045)','--h1':'linear-gradient(120deg,#161B26 15%,#E0701A 85%)','--fade':'rgba(246,248,252,.98)' };\n\nconst USERS = {\n  owner:       { pass:'IDCUBE@Owner2026', role:'Owner',      scope:'Full access · all data and exports' },\n  admin:       { pass:'idcube@2026',      role:'Admin',      scope:'Manage and browse the full org' },\n  leadership:  { pass:'people@2026',      role:'Leadership', scope:'Browse the org chart and teams' }\n};\nconst AUTH_KEY = 'idcube-org-auth';\nconst ACCESS_KEY = 'idcube-org-access';\nconst readAccess = () => { try { const r = JSON.parse(localStorage.getItem(ACCESS_KEY)||'[]'); return Array.isArray(r)? r : []; } catch(e){ return []; } };\nconst writeAccess = list => { try { localStorage.setItem(ACCESS_KEY, JSON.stringify(list)); } catch(e){} };\nconst makeToken = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);\nconst APP_URL = 'https://aakashkumar-cyber.github.io/People-chart/';\nconst SITE_URL = 'https://www.idcubesystems.com/in/en/';\nconst accessUrl = tok => APP_URL + '?access=' + tok;\nconst makePass = () => {\n  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZ', ns = '23456789';\n  let s = 'IDC-';\n  for (let i=0;i<3;i++) s += cs[Math.floor(Math.random()*cs.length)];\n  for (let i=0;i<3;i++) s += ns[Math.floor(Math.random()*ns.length)];\n  return s;\n};\n\nclass Component extends DCLogic {\n  state = { user:null, guest:null, loginUser:'', loginPass:'', loginError:'',\n            access:[], gName:'', gEmail:'', gDesig:'', gError:'',\n            emps:null, view:'home', focus:CEO, node:CEO, hist:[], q:'', filter:'All',\n            sheet:null, t:0, group:'Department', expanded:null, treeMode:'Chart',\n            theme:null, toast:null, chartPath:[CEO,''],\n            w: (typeof window!=='undefined'? window.innerWidth : 1200) };\n\n  componentDidMount(){\n    this.applyTheme();\n    const access = readAccess();\n    this.setState({ access });\n    let signedIn = false;\n    try {\n      const tok = new URLSearchParams(location.search).get('access');\n      if (tok) {\n        const rec = access.find(a=>a.token===tok);\n        if (rec) { this.setState({ guest:rec }); signedIn = true; }\n      }\n    } catch(e){}\n    if (!signedIn) try {\n      const saved = localStorage.getItem(AUTH_KEY);\n      if (saved && USERS[saved]) this.setState({ user:saved });\n      else if (saved && saved.slice(0,2)==='g:') {\n        const rec = access.find(a=>a.token===saved.slice(2));\n        if (rec) this.setState({ guest:rec });\n      }\n    } catch(e){}\n    this._rs = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this._rs);\n    const load = emps => {\n      const hash = decodeURIComponent(String(location.hash||'').replace(/^#p\\//,''));\n      const deep = hash && emps.find(e=>e.name===hash||e.id===hash);\n      this.setState({ emps, sheet: deep? deep.name : null }, ()=>this.run());\n    };\n    const inline = () => (typeof window!=='undefined' && Array.isArray(window.ORG_DATA)) ? window.ORG_DATA : null;\n    if (inline()) load(inline());\n    else {\n      let tries = 0;\n      const poll = setInterval(()=>{ if (inline()){ clearInterval(poll); load(inline()); } else if (++tries>20) clearInterval(poll); }, 60);\n      fetch('data/employees.json').then(r=>r.json()).then(d=>{ clearInterval(poll); load(d); })\n        .catch(()=>{ if (!inline()) this.setState({ emps:[] }); });\n    }\n  }\n  componentDidUpdate(){ this.applyTheme(); }\n  componentWillUnmount(){ clearTimeout(this._tt); window.removeEventListener('resize', this._rs); }\n\n  signIn(){\n    const u = String(this.state.loginUser||'').trim().toLowerCase();\n    const p = String(this.state.loginPass||'');\n    if (!u || !p) { this.setState({ loginError:'Enter both user ID and password' }); return; }\n    if (USERS[u] && USERS[u].pass===p) {\n      try { localStorage.setItem(AUTH_KEY, u); } catch(e){}\n      this.setState({ user:u, loginPass:'', loginError:'' }, ()=>this.run());\n      return;\n    }\n    const rec = readAccess().find(a=>String(a.email||'').toLowerCase()===u && a.pass===p.toUpperCase());\n    if (rec) {\n      try { localStorage.setItem(AUTH_KEY, 'g:'+rec.token); } catch(e){}\n      this.setState({ guest:rec, loginPass:'', loginError:'' }, ()=>this.run());\n      return;\n    }\n    this.setState({ loginError:'Incorrect user ID or password', loginPass:'' });\n  }\n  signOut(){\n    try { localStorage.removeItem(AUTH_KEY); } catch(e){}\n    try { if (new URLSearchParams(location.search).get('access')) history.replaceState(null,'',location.pathname); } catch(e){}\n    this.setState({ user:null, guest:null, loginUser:'', loginPass:'', loginError:'', view:'home', sheet:null, hist:[] });\n  }\n\n  grant(){\n    const name = String(this.state.gName||'').trim();\n    const email = String(this.state.gEmail||'').trim();\n    const desig = String(this.state.gDesig||'').trim();\n    if (!name || !email) { this.setState({ gError:'Name and email are both required' }); return; }\n    if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)) { this.setState({ gError:'That email address does not look right' }); return; }\n    const list = readAccess();\n    if (list.some(a=>String(a.email).toLowerCase()===email.toLowerCase())) { this.setState({ gError:'That email already has access' }); return; }\n    const rec = { name, email, desig: desig || 'Viewer', token: makeToken(), pass: makePass(), at: Date.now() };\n    const next = [rec, ...list];\n    writeAccess(next);\n    this.setState({ access:next, gName:'', gEmail:'', gDesig:'', gError:'' });\n    this.mailInvite(rec);\n    this.say('Access granted · ' + this.first(name));\n  }\n  revoke(token){\n    const next = readAccess().filter(a=>a.token!==token);\n    writeAccess(next);\n    this.setState({ access:next });\n    this.say('Access revoked');\n  }\n  mailInvite(rec){\n    const body = ['Hi '+rec.name+',','','You have been given access to the IDCUBE Org Graph.','','Your private link (opens you straight in):',accessUrl(rec.token),'','App link:',APP_URL,'','If you are ever asked to sign in, use:','User ID: '+rec.email,'Passcode: '+rec.pass,'','About IDCUBE: '+SITE_URL,'','— IDCUBE'].join('\\n');\n    const href = 'mailto:'+encodeURIComponent(rec.email)+'?subject='+encodeURIComponent('Your access to the IDCUBE Org Graph')+'&body='+encodeURIComponent(body);\n    try { window.open(href, '_self'); } catch(e){ location.href = href; }\n  }\n\n  theme(){ return this.state.theme || this.props.theme || 'Dark'; }\n  applyTheme(){\n    const vars = this.theme()==='Light' ? LIGHT : DARK;\n    const r = document.documentElement.style;\n    Object.keys(vars).forEach(k=>r.setProperty(k, vars[k]));\n    r.setProperty('--acc', this.props.accent || '#F5921E');\n  }\n  run(){\n    const t0 = performance.now(), dur = 1250;\n    const step = t => { const p = Math.min(1,(t-t0)/dur);\n      this.setState({ t: 1-Math.pow(1-p,3) }); if (p<1) requestAnimationFrame(step); };\n    requestAnimationFrame(step);\n  }\n  say(msg){ clearTimeout(this._tt); this.setState({toast:msg}); this._tt = setTimeout(()=>this.setState({toast:null}), 2200); }\n\n  go(view, focus){\n    this.setState(s=>({ view, focus: focus||s.focus, sheet:null,\n      hist: view==='team' ? [...s.hist, {view:s.view, focus:s.focus}] : s.hist }));\n    this.run(); window.scrollTo({top:0});\n  }\n  back(){\n    this.setState(s=>{ const h=[...s.hist], last=h.pop();\n      return last ? { hist:h, view:last.view, focus:last.focus, sheet:null } : { view:'home', sheet:null }; });\n  }\n\n  ini(n){ const p=String(n||'').replace(/[^A-Za-z .]/g,'').trim().split(/\\s+/).filter(x=>x.length>1); return ((p[0]||'?')[0]+((p[1]||p[0]||'')[0]||'')).toUpperCase(); }\n  first(n){ return String(n||'').split(/\\s+/)[0]; }\n  col(n){ let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))>>>0; return PAL[h%PAL.length]; }\n  av(n,size){\n    const c=this.col(n), s=size||38, f=Math.round(s*0.34);\n    return `flex:none;width:${s}px;height:${s}px;border-radius:${s>50?'50%':'13px'};display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:700;font-size:${f}px;color:#fff;background:linear-gradient(145deg,${c},${c}99);box-shadow:0 5px 16px ${c}3d`;\n  }\n\n  build(){\n    const emps = this.state.emps || [];\n    const by = {}; emps.forEach(e=>by[e.name]=e);\n    const norm = n => { let x=String(n||'').trim(); x=FIX[x]||x; return by[x]?x:''; };\n    const kids = {}, roots = [], dotKids = {};\n    emps.forEach(e=>{\n      const m = norm(e.mgr);\n      e._m = (m===e.name) ? '' : m;\n      e._d = norm(e.dotted)===e.name ? '' : norm(e.dotted);\n      if (e._m) (kids[e._m]=kids[e._m]||[]).push(e.name); else roots.push(e.name);\n      if (e._d) (dotKids[e._d]=dotKids[e._d]||[]).push(e.name);\n    });\n    const tot = {};\n    const total = n => { if (tot[n]!=null) return tot[n]; tot[n]=0;\n      tot[n] = (kids[n]||[]).reduce((a,k)=>a+1+total(k),0); return tot[n]; };\n    emps.forEach(e=>total(e.name));\n    Object.keys(kids).forEach(k=>kids[k].sort((a,b)=>(total(b)-total(a))||a.localeCompare(b)));\n    const depth = n => { let d=0,c=by[n]; while(c&&c._m){d++;c=by[c._m];} return d; };\n    return { emps, by, kids, dotKids, total, depth, roots };\n  }\n\n  card(name, g, tap){\n    const e = g.by[name] || {};\n    return { name, title:e.title||'', ini:this.ini(name), first:this.first(name),\n      avStyle:this.av(name,40), meta:[e.dept,e.loc].filter(Boolean).join(' · '),\n      direct:(g.kids[name]||[]).length, total:g.total(name),\n      hasTeam:(g.kids[name]||[]).length>0, tap };\n  }\n\n  renderVals(){\n    const g = this.build();\n    const { emps, by, kids, dotKids, total, depth, roots } = g;\n    const t = this.state.t, v = this.state.view, loaded = emps.length>0;\n    const W = this.state.w, desk = W>=1000, wide = W>=700;\n    const openTeam = n => () => this.go('team', n);\n    const openSheet = n => () => this.setState({ sheet:n });\n    const tapPerson = n => (kids[n]||[]).length ? openTeam(n) : openSheet(n);\n    const setNode = n => () => { this.setState({ node:n }); this.run(); };\n\n    const uniq = k => [...new Set(emps.map(e=>e[k]).filter(Boolean))];\n    const mgrCount = Object.keys(kids).length;\n\n    // ---------- responsive shell\n    const shellStyle = `min-height:100vh;background:var(--bg);color:var(--tx);font-family:Manrope,sans-serif;display:flex;${desk?'':'flex-direction:column'}`;\n    const sideStyle = desk\n      ? 'position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;width:248px;flex:none;display:flex;flex-direction:column;padding:26px 18px;border-right:1px solid var(--line);background:var(--s1)'\n      : 'display:none';\n    const mainStyle = `flex:1;min-width:0;${desk?'padding:30px 34px 48px':(wide?'padding:24px 26px 120px':'padding:20px 16px 116px')}`;\n    const innerStyle = 'max-width:1180px;margin:0 auto';\n    const heroStyle = `position:relative;overflow:hidden;border-radius:${desk?'26px':'22px'};background:linear-gradient(165deg,var(--s2),var(--bg) 92%);border:1px solid var(--line);padding:${desk?'26px 28px':'20px'}`;\n    const topBarStyle = `position:relative;display:${desk?'none':'flex'};align-items:center;gap:12px`;\n    const dashGrid = `display:grid;gap:${desk?'18px':'16px'};margin-top:${desk?'22px':'18px'};grid-template-columns:${desk?'repeat(2,minmax(0,1fr))':'minmax(0,1fr)'}`;\n    const spanAll = desk ? 'grid-column:1 / -1' : '';\n    const teamGrid = `display:grid;gap:10px;margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(${wide?'300px':'240px'},1fr))`;\n    const momentGrid = `display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(${wide?'320px':'260px'},1fr))`;\n    const nodeKidGrid = `display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(${wide?'190px':'150px'},1fr))`;\n    const tabBarStyle = desk ? 'display:none'\n      : 'position:fixed;left:0;right:0;bottom:0;z-index:70;padding:9px 10px 22px;background:linear-gradient(to top,var(--fade) 60%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:3px';\n    const logoChip = 'padding:0;background:none;border:none';\n\n    // ---------- dashboard\n    const kpiChips = [\n      { n: loaded? uniq('dept').length : '—', label:'Depts' },\n      { n: loaded? uniq('loc').length : '—', label:'Cities' },\n      { n: loaded? mgrCount : '—', label:'Managers' },\n      { n: loaded? (Math.round(emps.length/Math.max(1,mgrCount)*10)/10) : '—', label:'Avg span' }\n    ];\n    const groupKey = (this.state.group==='Location') ? 'loc' : 'dept';\n    const counts = {}; emps.forEach(e=>{ const k=e[groupKey]||'—'; counts[k]=(counts[k]||0)+1; });\n    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, desk?8:7);\n    const maxN = sorted.length? sorted[0][1] : 1;\n    const bars = sorted.map(([label,n],i)=>({ label, n,\n      fill:`height:100%;width:${(n/maxN*100*t).toFixed(1)}%;border-radius:999px;background:linear-gradient(90deg,${PAL[i%PAL.length]},${PAL[i%PAL.length]}99)` }));\n    const groupTabs = ['Department','Location'].map(label=>({ label,\n      pick:()=>this.setState({group:label}),\n      style:`padding:6px 13px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;${this.state.group===label?'background:var(--acc);color:#fff':'color:var(--mu)'}` }));\n\n    const leadNames = [...new Set([...ROOTS.filter(n=>by[n]), ...ROOTS.flatMap(r=>kids[r]||[])])];\n    const leaders = leadNames.map(n=>({ ...this.card(n,g,null), open:openTeam(n),\n      principal: ROOTS.indexOf(n)>=0 }));\n    const topTeams = Object.keys(kids)\n      .sort((a,b)=>(kids[b].length-kids[a].length)||a.localeCompare(b)).slice(0, desk?12:8)\n      .map(n=>{\n        const pips = (kids[n]||[]).slice(0,10).map((k,i)=>`width:${(kids[k]||[]).length?9:5}px;height:5px;border-radius:999px;background:${(kids[k]||[]).length?'var(--acc)':'var(--line)'};opacity:${(0.35+0.65*Math.min(1,Math.max(0,t*10-i))).toFixed(2)}`);\n        return { ...this.card(n,g,null), open:openTeam(n), pips }; });\n\n    const years = {};\n    emps.forEach(e=>{ if(e.doj){ const y=+e.doj.slice(0,4); if(y>1990) years[y]=(years[y]||0)+1; } });\n    const ys = Object.keys(years).map(Number).sort((a,b)=>a-b);\n    let cum = 0; const pts = ys.map(y=>{ cum+=years[y]; return {y, v:cum}; });\n    const H = 96, Wc = 320, maxV = pts.length? pts[pts.length-1].v : 1;\n    const xy = pts.map((p,i)=>({ x: pts.length>1 ? i/(pts.length-1)*Wc : 0, y: H - (p.v/maxV)*(H-12) - 6 }));\n    const shown = Math.max(2, Math.ceil(xy.length * Math.max(.02,t)));\n    const seg = xy.slice(0, shown);\n    const dd = seg.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');\n    const lastPt = seg[seg.length-1] || {x:0,y:H};\n    const lastYear = ys[ys.length-1];\n\n    const now = new Date();\n    const withDoj = emps.filter(e=>e.doj);\n    const recent = withDoj.slice().sort((a,b)=>b.doj.localeCompare(a.doj)).slice(0,8);\n    const annis = withDoj.filter(e=>(+e.doj.slice(5,7))===now.getMonth()+1)\n      .sort((a,b)=>a.doj.slice(8).localeCompare(b.doj.slice(8)));\n    const moments = [\n      { label:'Newest joiners', count: recent.length? recent[0].doj.slice(0,7) : '—',\n        people: recent.map(e=>({ first:this.first(e.name), note:(e.doj||'').slice(0,7), avStyle:this.av(e.name,52), tap:openSheet(e.name) })) },\n      { label:`Anniversaries in ${MONTHS[now.getMonth()]}`, count: annis.length,\n        people: annis.slice(0,10).map(e=>({ first:this.first(e.name), note:Math.max(1,now.getFullYear()-(+e.doj.slice(0,4)))+' yrs', avStyle:this.av(e.name,52), tap:openSheet(e.name) })) }\n    ];\n\n    // ---------- team\n    const fName = this.state.focus || CEO, fe = by[fName] || {};\n    const focus = { name:fName, title:fe.title||'', ini:this.ini(fName),\n      direct:(kids[fName]||[]).length,\n      total: this.props.showTotals===false ? (kids[fName]||[]).length : total(fName),\n      depth: depth(fName)+1 };\n    const focusStats = [\n      { n:focus.direct, label:'Direct', style:'flex:1;min-width:92px;padding:14px;border-radius:16px;background:rgba(245,146,30,.13);border:1px solid rgba(245,146,30,.32)' },\n      { n:focus.total, label:'Total org', style:'flex:1;min-width:92px;padding:14px;border-radius:16px;background:var(--soft);border:1px solid var(--line)' },\n      { n:focus.depth, label:'Level', style:'flex:1;min-width:92px;padding:14px;border-radius:16px;background:var(--soft);border:1px solid var(--line)' }\n    ];\n    const focusTags = [fe.dept, fe.sub, fe.loc].filter(Boolean);\n    const chainNames = []; { let c=by[fName]; while(c&&c._m){ chainNames.unshift(c._m); c=by[c._m]; } }\n    const chain = chainNames.map(n=>({ name:n, ini:this.ini(n), avStyle:this.av(n,24), open:openTeam(n) }));\n    const team = (kids[fName]||[]).map(n=>({ ...this.card(n,g,null), tap:tapPerson(n) }));\n    const dotted = (dotKids[fName]||[]).map(n=>({ ...this.card(n,g,null), tap:openSheet(n),\n      tagline:(by[n]._m? 'solid → '+this.first(by[n]._m) : 'dotted') }));\n\n    // ---------- search\n    const q = this.state.q.trim().toLowerCase(), f = this.state.filter;\n    const pool = emps.filter(e=>{\n      if (f!=='All' && e.loc!==f) return false;\n      if (!q) return true;\n      return [e.name,e.title,e.dept,e.sub,e.loc,e.email].join(' ').toLowerCase().includes(q);\n    });\n    const results = pool.slice(0, desk?60:40).map(e=>({ ...this.card(e.name,g,null), tap:openSheet(e.name) }));\n    const locs = ['All', ...uniq('loc').sort((a,b)=>emps.filter(e=>e.loc===b).length-emps.filter(e=>e.loc===a).length)];\n    const quickFilters = locs.map(label=>({ label, pick:()=>this.setState({filter:label}),\n      style:`flex:none;padding:8px 13px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .18s;border:1px solid ${f===label?'transparent':'var(--line)'};${f===label?'background:var(--acc);color:#fff':'background:var(--s1);color:var(--mu)'}`}));\n\n    // ---------- tree: indented\n    const exp = this.state.expanded || { [CEO]:true };\n    const treeRows = [];\n    const walk = (n, lvl) => {\n      const e = by[n]||{}, open = !!exp[n], kc = (kids[n]||[]).length;\n      treeRows.push({ name:n, title:e.title||'', ini:this.ini(n), direct:kc, hasTeam:kc>0,\n        loc:e.loc||'', locStyle: wide? 'flex:none;font-size:10.5px;font-weight:700;color:var(--mu);letter-spacing:.3px;margin-right:6px' : 'display:none',\n        avStyle:this.av(n, lvl===0?40:32),\n ;${wide?'align-items:center;padding:24px':'align-items:flex-end'}`;\n    const sheetStyle = wide\n      ? 'position:relative;z-index:1;width:100%;max-width:640px;max-height:calc(100vh - 48px);overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:24px;animation:popIn .3s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 30px 90px rgba(0,0,0,.5)'\n      : 'position:relative;z-index:1;width:100%;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,var(--s2),var(--s1) 30%);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:14px 18px 34px;animation:sheetUp .34s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 -20px 60px rgba(0,0,0,.45)';\n\n    // ---------- nav\n    const isOwner = this.state.user==='owner';\n    const items = [ {id:'home',label:'Dashboard'},{id:'tree',label:'Org tree'},\n                    {id:'search',label:'Search'},\n                    ...(isOwner? [{id:'access',label:'Access'}] : []) ];\n    const pick = id => () => { this.setState({view:id, sheet:null, hist:[]}); this.run(); window.scrollTo({top:0}); };\n    const tabs = items.map(tb=>({ label:tb.label, pick:pick(tb.id),\n      style:`flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:14px;cursor:pointer;font-size:10.5px;font-weight:700;white-space:nowrap;transition:all .22s;color:${v===tb.id?'var(--tx)':'var(--mu)'};background:${v===tb.id?'var(--soft)':'transparent'}`,\n      dotStyle:`width:${v===tb.id?'18px':'5px'};height:5px;border-radius:999px;background:${v===tb.id?'var(--acc)':'var(--line)'};transition:all .28s cubic-bezier(.2,.8,.2,1)` }));\n    tabs.push({ label:'Sign out', pick: ()=>this.signOut(),\n      style:'flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:14px;cursor:pointer;font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--acc);background:rgba(245,146,30,.14);border:1px solid rgba(245,146,30,.4)',\n      dotStyle:'width:12px;height:5px;border-radius:999px;background:var(--acc)' });\n    const sideTabs = items.map(tb=>({ label:tb.label, pick:pick(tb.id),\n      style:`display:flex;align-items:center;gap:11px;padding:12px 13px;margin-bottom:5px;border-radius:13px;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s;color:${v===tb.id?'var(--tx)':'var(--mu)'};background:${v===tb.id?'var(--soft)':'transparent'}`,\n      dotStyle:`width:${v===tb.id?'16px':'6px'};height:6px;border-radius:999px;background:${v===tb.id?'var(--acc)':'var(--line)'};transition:all .28s cubic-bezier(.2,.8,.2,1)` }));\n\n    // ---------- access control\n    const DATEF = ts => { const d = new Date(ts); return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getFullYear(); };\n    const accessList = this.state.access || [];\n    const granted = accessList.map(a=>({\n      name:a.name, email:a.email, desig:a.desig, pass:a.pass, when:DATEF(a.at),\n      ini:this.ini(a.name), avStyle:this.av(a.name,40),\n      revoke: ()=>this.revoke(a.token),\n      mail: ()=>this.mailInvite(a),\n      copy: ()=>{ const url = accessUrl(a.token);\n        if (navigator.clipboard) navigator.clipboard.writeText(url).then(()=>this.say('Link copied · '+this.first(a.name))).catch(()=>this.say(url));\n        else this.say(url); }\n    }));\n    const accessGrid = `display:grid;gap:16px;margin-top:20px;grid-template-columns:${desk?'minmax(0,340px) minmax(0,1fr)':'minmax(0,1fr)'}`;\n\n    const shareTarget = this.state.sheet || fName;\n    const signedIn = !!(this.state.user || this.state.guest);\n    return {\n      locked: !signedIn, unlocked: signedIn,\n      isAccess: v==='access' && isOwner, accessGrid, granted,\n      noAccess: granted.length===0,\n      accessMeta: granted.length? granted.length+(granted.length===1?' person':' people') : '',\n      gName:this.state.gName, gEmail:this.state.gEmail, gDesig:this.state.gDesig, gError:this.state.gError,\n      onGName: e=>this.setState({gName:e.target.value, gErro ebkit-background-clip:text;background-clip:text;color:transparent`,\n      trendH: desk? 150 : 96,\n\n      isHome:v==='home', isTeam:v==='team', isSearch:v==='search', isTree:v==='tree', \n      themeIcon: this.theme()==='Light' ? '☾' : '☀', themeLabel: this.theme()==='Light' ? 'Dark mode' : 'Light mode',\n      toggleTheme: ()=>this.setState({ theme: this.theme()==='Light'?'Dark':'Light' }),\n      rosterCount: loaded? emps.length : '—', rosterNote: loaded? `${mgrCount} managers · ${uniq('loc').length} cities` : 'loading',\n\n      heroNum: loaded ? String(Math.round(emps.length*t)) : '—',\n      kpiChips, bars, groupTabs, leaders, topTeams, leadCount: leadNames.length,\n      trendLine: seg.length? dd : 'M0 90', trendArea: seg.length? `${dd} L${lastPt.x.toFixed(1)} ${H} L0 ${H} Z` : '',\n      trendDotX:lastPt.x.toFixed(1), trendDotY:lastPt.y.toFixed(1),\n      trendLabels: ys.filter((y,i)=>i===0||i===ys.length-1||i===Math.floor(ys.length/2)||i===Math.floor(ys.length/4)||i===Math.floor(ys.length*3/4)).map(String),\n      trendNote: lastYear? `${years[lastYear]||0} joined ${lastYear}` : '', moments,\n\n      teamHeroStyle: `position:relative;overflow:hidden;border-radius:${desk?'26px':'22px'};background:linear-gradient(170deg,var(--s2),var(--bg) 90%);border:1px solid var(--line);padding:${desk?'24px 26px':'18px'}`,\n      focus, focusStats, focusTags, focusAvStyle:this.av(fName,64), chain, hasChain:chain.length>0,\n      team, teamHeading: focus.direct ? 'Direct team' : 'No direct reports',\n      teamMeta: focus.direct? `${focus.direct} people` : 'Individual contributor',\n      dotted, hasDotted: dotted.length>0,\n\n      q:this.state.q, onQ: e=>this.setState({q:e.target.value}),\n      results, quickFilters, resultLabel:`${pool.length} ${pool.length===1?'person':'people'}`,\n\n      chartCols, chartBoxStyle, treeChart:this.state.treeMode==='Chart',\n      treeRows, treeModes, treeHint, treeIndent:this.state.treeMode==='Indented',\n      treeLevels:this.state.treeMode==='Levels', treeOrbit:this.state.treeMode==='Orbit',\n      node, crumbs, nodeKids, nodeAvStyle:this.av(nName,52), nodeOpen: openTeam(nName),\n      orbit, orbitCenterAv:this.av(nName,66)+';margin:0 auto',\n      orbitCenterMeta: node.direct? node.direct+' direct' : 'no reports',\n      orbitUp: ()=>{ const up = by[nName] && by[nName]._m; if(up){ this.setState({node:up}); this.run(); } else this.say('Top of the organisation'); },\n\n      tabs, sideTabs, sheet, toast:this.state.toast,\n      closeSheet: ()=>this.setState({sheet:null}), back: ()=>this.back(),\n      share: ()=>{ const url = location.origin+location.pathname+'#p/'+encodeURIComponent(shareTarget);\n        if (navigator.clipboard) navigator.clipboard.writeText(url).then(()=>this.say('Link copied · '+this.first(shareTarget))).catch(()=>this.say(url));\n        else this.say(url); },\n      exportPdf: ()=>{ this.say('Opening print sheet…'); setTimeout(()=>{ try{ window.print(); }catch(e){} }, 400); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
